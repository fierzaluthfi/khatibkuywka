<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001fb8"/>
      <stop offset="100%" stop-color="#000f61"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff5100"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle (Soft Accent) -->
  <circle cx="50" cy="50" r="46" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" />

  <!-- Base / Platform -->
  <rect x="20" y="78" width="60" height="5" rx="2.5" fill="#001fb8"/>

  <!-- Left Minaret -->
  <rect x="22" y="38" width="7" height="40" rx="1.5" fill="url(#domeGrad)"/>
  <polygon points="21,38 25.5,24 30,38" fill="url(#goldGrad)"/>
  <circle cx="25.5" cy="22" r="1.5" fill="#ff9100"/>

  <!-- Right Minaret -->
  <rect x="71" y="38" width="7" height="40" rx="1.5" fill="url(#domeGrad)"/>
  <polygon points="70,38 74.5,24 79,38" fill="url(#goldGrad)"/>
  <circle cx="74.5" cy="22" r="1.5" fill="#ff9100"/>

  <!-- Main Mosque Building Walls -->
  <rect x="29" y="52" width="42" height="26" fill="#ffffff" stroke="#c7d2fe" stroke-width="1"/>

  <!-- Central Great Dome -->
  <path d="M 32 52 C 32 30, 44 26, 50 18 C 56 26, 68 30, 68 52 Z" fill="url(#domeGrad)" filter="url(#shadow)"/>

  <!-- Crescent & Star on Main Dome -->
  <path d="M 50 11 A 4 4 0 1 0 52 17 A 3.2 3.2 0 1 1 50 11 Z" fill="url(#goldGrad)"/>
  <circle cx="53" cy="12.5" r="1" fill="#ff9100"/>

  <!-- Arched Main Gate (Mihrab) -->
  <path d="M 43 78 L 43 65 C 43 60, 50 56, 50 56 C 50 56, 57 60, 57 65 L 57 78 Z" fill="url(#goldGrad)"/>

  <!-- Left & Right Small Windows -->
  <path d="M 34 68 L 34 62 C 34 59, 36.5 57, 36.5 57 C 36.5 57, 39 59, 39 62 L 39 68 Z" fill="#001fb8" opacity="0.85"/>
  <path d="M 61 68 L 61 62 C 61 59, 63.5 57, 63.5 57 C 63.5 57, 66 59, 66 62 L 66 68 Z" fill="#001fb8" opacity="0.85"/>
</svg>
